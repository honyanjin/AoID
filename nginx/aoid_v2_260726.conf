map $http_user_agent $is_bot {
    default 0;
    ~*(google-inspectiontool|googlebot|bingbot|yeti|daum|naverbot|facebookexternalhit|twitterbot|kakaotalk-scrap|linkedinbot) 1;
}

server {
    server_name aoid.kr www.aoid.kr;
    client_max_body_size 50M;

    # [수정] 프론트엔드 락 또는 백엔드 락 중 하나라도 있으면 503 유지관리 모드 유지
    set $m_mode 0;
    if (-f /var/www/html/frontend_deploy.lock) {
        set $m_mode 1;
    }
    if (-f /var/www/html/backend_deploy.lock) {
        set $m_mode 1;
    }
    if ($uri = /maintenance.html) {
        set $m_mode 0;
    }
    if ($m_mode = 1) {
        return 503;
    }
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/html;
    }

 
    # 동적 sitemap.xml 백엔드 라우팅 프록시
    location = /sitemap.xml {
    proxy_pass http://localhost:5000/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트엔드 (React 빌드 파일)
    root /var/www/html;
    index index.html;

    # React Router 지원 (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API 프록시
    location /api {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }



    # 업로드 이미지 프록시 (트위터/외부 봇 접근 허용 헤더 추가)
    location /uploads {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 외부 스크랩 봇(트위터, 카카오 등) 이미지 접근 허용
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";
    }

    # -------------------------------------------------------------
    # 게시글 경로 (크롤러 봇만 SEO 엔드포인트 프록시, 일반 사용자는 React SPA 렌더링)
    # -------------------------------------------------------------
    location ~* ^/(board|[a-zA-Z0-9_-]+)/([0-9]+)$ {
        if ($is_bot = 1) {
            rewrite ^/(board|[a-zA-Z0-9_-]+)/([0-9]+)$ /seo/$1/$2 break;
            proxy_pass http://localhost:5000;
        }
        root /var/www/aoid/frontend/build;
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------
    # 데브스펙트럼 결과페이지 경로 (크롤러 봇만 SEO 엔드포인트 프록시)
    # -------------------------------------------------------------
    location ~* ^/dev-spectrum/(triangle-test|multiple-choice)/result/([^/]+)$ {
        if ($is_bot = 1) {
            rewrite ^/dev-spectrum/(triangle-test|multiple-choice)/result/([^/]+)$ /seo/dev-spectrum/$1/result/$2 break;
            proxy_pass http://localhost:5000;
        }
        root /var/www/aoid/frontend/build;
        try_files $uri $uri/ /index.html;
    }

    # 레거시 결과페이지 경로 (하위 호환)
    location ~* ^/(triangle-test|multiple-choice)/result/([^/]+)$ {
        if ($is_bot = 1) {
            rewrite ^/(triangle-test|multiple-choice)/result/([^/]+)$ /seo/$1/result/$2 break;
            proxy_pass http://localhost:5000;
        }
        root /var/www/aoid/frontend/build;
        try_files $uri $uri/ /index.html;
    }

  
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aoid.kr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aoid.kr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.aoid.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = aoid.kr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name aoid.kr www.aoid.kr;
    client_max_body_size 50M;
    return 404; # managed by Certbot

    # [수정] 프론트엔드 락 또는 백엔드 락 중 하나라도 있으면 503 유지관리 모드 유지
    set $m_mode 0;
    if (-f /var/www/html/frontend_deploy.lock) {
        set $m_mode 1;
    }
    if (-f /var/www/html/backend_deploy.lock) {
            set $m_mode 1;
    }
    if ($uri = /maintenance.html) {
        set $m_mode 0;
    }
    if ($m_mode = 1) {
        return 503;
    }
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/html;
    } 


}
